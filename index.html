<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>
  <main>
    <h1 class="visually-hidden">Blog preview card</h1>
    <article class="card">
      <a class="card-link" href="#">
        <img class="card-image" src="assets/images/illustration-article.svg" width="336" height="200"
          alt="Abstract pattern with HTML code elements"></a>
      <section class="tags">
        <span class="tag">Learning</span>
      </section>
      <p class="date">Published 21 Dec 2023</p>
      <h2 class="title"><a class="card-link" href="#">HTML & CSS foundations</a></h2>
      <p class="description">These languages are the backbone of every website, defining structure, content, and
        presentation.</p>
      <div class="author">
        <img class="author-avatar" src="assets/images/image-avatar.webp" alt="Author's avatar" width="32" height="32">
        <span class="author-name">Greg Hooper</span>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/Ekaterina-alekse">Kolbina Ekaterina</a>.
  </footer>

</body>

</html>
